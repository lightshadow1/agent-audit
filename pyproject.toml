[project]
name = "ai-agent-audit"
version = "0.1.0"
description = "OpenTelemetry GenAI traces → EU AI Act Article 12 evidence reports"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Will Suriaputra" }]
keywords = ["ai", "compliance", "eu-ai-act", "opentelemetry", "audit", "article-12", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.25",
]

[project.urls]
Homepage = "https://github.com/lightshadow1/agent-audit"
Repository = "https://github.com/lightshadow1/agent-audit"
Issues = "https://github.com/lightshadow1/agent-audit/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
    "anthropic>=0.40.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
agentaudit = "agentaudit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
