name: Publish to PyPI

# Trigger on GitHub releases only — never on raw pushes.
# Workflow: tag a release in the GitHub UI → this builds and publishes.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # Required for PyPI trusted publishing (no API tokens needed)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Gate: run the full test suite before publishing ──
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -v --tb=short

  # ── Build distribution artifacts ──
  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build wheel and sdist
        run: uv build

      - name: Verify version matches release tag
        run: |
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: pyproject.toml=$PKG_VERSION, tag=$TAG_VERSION"
            exit 1
          fi
          echo "Version $PKG_VERSION matches tag $TAG_VERSION ✓"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  # ── Publish to Test PyPI first (catches metadata issues early) ──
  publish-test:
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: test-pypi
      url: https://test.pypi.org/p/agentaudit
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Uses OIDC trusted publishing — no tokens needed.
          # Set up at: https://test.pypi.org/manage/account/publishing/
          skip-existing: true

  # ── Publish to Production PyPI ──
  publish-prod:
    runs-on: ubuntu-latest
    needs: [publish-test]
    environment:
      name: pypi
      url: https://pypi.org/p/agentaudit
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no tokens needed.
        # Set up at: https://pypi.org/manage/account/publishing/
