name: Build artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run tests
        run: |
          python -m pip install pytest
          pytest -q

      - name: Generate sample compliance report
        run: |
          mkdir -p artifacts
          agentaudit report tests/fixtures/otel_pass.jsonl \
            --retention-days 180 \
            --out artifacts/agentaudit-compliance-report.html \
            --json artifacts/agentaudit-compliance-report.json \
            --quiet

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: agentaudit-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: agentaudit-compliance-report
          path: artifacts/*
          if-no-files-found: error
